<title>Actor viewer</title>
<style>
  :root { color-scheme: dark; }
  body { background: #20222a; color: #e8e2d0; font: 11px/1.2 ui-monospace, monospace; overflow: hidden; }
  canvas { display: block; } .tag { position: absolute; transform: translate(-50%, 0); white-space: nowrap; text-shadow: 0 1px 2px #000; }
</style>
<canvas id="c"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
  import { createAssets } from '../js/gfx/assets.js';
  import { registerTints } from '../js/gfx/tints.js';
  import { createActors, LOOKS, drifterLook } from '../js/gfx/actors.js';
  const q = new URLSearchParams(location.search);
  window.addEventListener('error', (e) => { window.ERR = String(e.message) + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno; window.READY = true; });
  window.addEventListener('unhandledrejection', (e) => { window.ERR = String(e.reason && (e.reason.stack || e.reason.message) || e.reason).slice(0, 600); window.READY = true; });
  const assets = createAssets();
  await assets.load('../assets/');
  registerTints(assets);
  const actors = createActors(assets);
  const W = innerWidth, H = innerHeight;
  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
  renderer.setSize(W, H); renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.95;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const scene = new THREE.Scene(); scene.background = new THREE.Color('#6d7a8a');
  scene.add(new THREE.HemisphereLight(0xcfe4ff, 0xa07a5a, 0.6));
  const sun = new THREE.DirectionalLight(0xffeccf, 0.95); sun.position.set(-8, 14, 10); sun.castShadow = true;
  Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20 }); sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.03;
  scene.add(sun);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshLambertMaterial({ color: 0x8a7a66 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  const which = (q.get('set') || 'enemies');
  let list = [];
  if (which === 'drifters') list = Array.from({ length: 12 }, (_, i) => ['drifter ' + i, drifterLook(i, i % 3 === 0 ? ['lantern', 'duster'] : []), { player: true, gun: ['Revolver_1', 'SniperRifle_2', 'Shotgun_1'][i % 3] }]);
  else if (which === 'robots') list = ['guard','scout','foreman'].map((k) => [k, { ...LOOKS[k], gun: null, scale: 1 }, {}]);
  else if (which === 'enemies') list = ['bandit', 'gunman', 'guard', 'scout', 'dynamiter', 'brute', 'walker', 'husk', 'bounty', 'foreman'].map((k) => [k, LOOKS[k], {}]);
  else list = Object.keys(LOOKS).filter((k) => k.startsWith('keeper') || ['clerk', 'marshal', 'rider', 'agent', 'undertaker', 'townsman', 'townswoman', 'towns2', 'towns3'].includes(k)).map((k) => [k, LOOKS[k], { enemy: false }]);
  const cols = +(q.get('cols') || Math.ceil(list.length / 2)), cell = 2.4;
  const t = +(q.get('t') || 0.4);
  const tags = [];
  list.forEach(([name, look, o], i) => {
    const a = actors.make(look, o);
    if (o.gun) actors.setGun(a, o.gun);
    const x = (i % cols) * cell, z = Math.floor(i / cols) * 3.2;
    actors.place(a, x, z, Math.PI / 2 + (+(q.get('turn') || 0)));
    scene.add(a.root);
    const mode = q.get('pose') || 'aim';
    if (mode === 'dead') a.dead = true;
    if (mode === 'melee') a.meleeT = 0.2;
    if (mode === 'shoot') a.shootT = 0;
    for (let k = 0; k < 30; k++) actors.update(a, t / 30, { speed: mode === 'walk' ? 3 : mode === 'run' ? 6.5 : 0, armed: mode !== 'idle' && mode !== 'walk' && mode !== 'run', sit: mode === 'sit' });
    tags.push({ name, x, z });
  });
  const rows = Math.ceil(list.length / cols);
  const cx = (cols - 1) * cell / 2, cz = (rows - 1) * 3.2 / 2;
  const az = +(q.get('az') || 20) * Math.PI / 180, el = +(q.get('el') || 12) * Math.PI / 180;
  const span = +(q.get('span') || Math.max(rows * 2.2, cols * cell * H / W * 0.6));
  const cam = new THREE.OrthographicCamera(-span * W / H, span * W / H, span, -span, 0.1, 300);
  cam.position.set(cx + Math.sin(az) * Math.cos(el) * 60, Math.sin(el) * 60 + 1, cz + Math.cos(az) * Math.cos(el) * 60);
  cam.lookAt(cx, 1.0, cz);
  renderer.render(scene, cam);
  for (const tg of tags) {
    const v = new THREE.Vector3(tg.x, -0.15, tg.z + 0.9).project(cam);
    const el2 = document.createElement('div'); el2.className = 'tag'; el2.textContent = tg.name;
    el2.style.left = ((v.x + 1) / 2 * W) + 'px'; el2.style.top = ((1 - v.y) / 2 * H) + 'px'; document.body.appendChild(el2);
  }
  window.READY = true;
</script>
